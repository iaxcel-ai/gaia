# Render blueprint: one web service that serves both the API and the built React client.
# The database is hosted separately (for example Neon); its connection string is set as DATABASE_URL.
services:
  - type: web
    name: gaia
    runtime: node
    plan: free
    # Build the client, then install the server. The client's build tools are dev dependencies.
    buildCommand: npm install --include=dev --prefix client && npm run build --prefix client && npm install --prefix server
    # Apply database migrations, add the Gasabo facilities and the admin account, add the demo data
    # (all safe to repeat), then start.
    startCommand: npm run migrate up --prefix server && node server/scripts/seed.js && node server/scripts/seed-demo.js && npm run start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Demo staff accounts, resource counts and referrals for graders. Remove SEED_DEMO to turn them off.
      # These accounts only hold made-up data, so their password is not a secret.
      - key: SEED_DEMO
        value: "true"
      - key: DEMO_PASSWORD
        value: gaia-demo-2026
