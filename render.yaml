# Render blueprint: one web service that serves both the API and the built React client.
# The database is hosted separately (for example Neon); its connection string is set as DATABASE_URL.
services:
  - type: web
    name: gaia
    runtime: node
    plan: free
    # Build the client, then install the server. The client's build tools are dev dependencies.
    buildCommand: npm install --include=dev --prefix client && npm run build --prefix client && npm install --prefix server
    # Apply database migrations, add the Gasabo facilities and the admin account (safe to repeat), then start.
    startCommand: npm run migrate up --prefix server && node server/scripts/seed.js && npm run start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
